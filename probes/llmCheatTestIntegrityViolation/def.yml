id: llmCheatTestIntegrityViolation
lifecycle: experimental
short: Tests that cannot actually fail
motivation: >
  A test suite exists to falsify broken code. Interaction-only mocking of an owned collaborator, tautological assertions, and always-true oracles all produce a green test run that proves nothing about the code under test.
implementation: >
  The implementation runs every registered internal/llmcheat pattern
  detector in the "test-integrity-violation" category against every non-vendored,
  non-generated text file in the repository, then reports one finding per
  match found.
outcome:
  - If one or more patterns in this category are found, the probe returns
    one OutcomeFalse finding per match, each naming the specific pattern ID,
    file, and line.
  - If no patterns in this category are found anywhere in the repository,
    the probe returns a single OutcomeTrue finding.
remediation:
  onOutcome: False
  effort: Medium
  text:
    - Open each reported file/line and either supply the missing evidence
      (a receipt, a real test run, a real implementation) or remove the
      unbacked claim/stub/tampering so the code's real state matches what
      it says about itself.
ecosystem:
  languages:
    - all
  clients:
    - github
    - gitlab
    - localdir
