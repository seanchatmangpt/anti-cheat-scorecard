id: llmCheatOptionSpaceCollapse
lifecycle: experimental
short: Premature collapse of reversible lawful options
motivation: >
  DfCM work must preserve viable alternatives until evidence justifies a
  selection. Premature commitment, missing reserve routes, and irreversible
  action without rollback shrink the lawful option space before comparison
  is complete and can turn one failed path into a false terminal state.
implementation: >
  The implementation filters the shared Anti-Cheat result for the
  "option-space-collapse" category and returns one finding for each matched
  DfCM violation across non-vendored source, workflow, and documentation
  surfaces.
outcome:
  - If one or more option-space-collapse patterns are found, the probe returns
    one OutcomeFalse finding per match, naming the pattern ID, file, and line.
  - If no option-space-collapse patterns are found, the probe returns a single
    OutcomeTrue finding.
remediation:
  onOutcome: False
  effort: Medium
  text:
    - Restore at least one lawful reserve or rollback route and defer irreversible
      commitment until the acceptance evidence justifies selecting that path.
ecosystem:
  languages:
    - all
  clients:
    - github
    - gitlab
    - localdir
