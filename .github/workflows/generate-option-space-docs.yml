name: Generate option-space probe docs

on:
  push:
    branches:
      - fix/gitlab-capability-routing-chicago-v2
    paths:
      - .github/workflows/generate-option-space-docs.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/gitlab-capability-routing-chicago-v2
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Generate and prove containment
        shell: bash
        run: |
          set -euo pipefail
          go env -w GOFLAGS=-mod=mod
          make generate-docs
          changed="$(git diff --name-only)"
          test "$changed" = "docs/probes.md"
          git diff --check
      - name: Commit generated artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/probes.md
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'docs(probes): regenerate option-space probe docs'
          git push origin HEAD:fix/gitlab-capability-routing-chicago-v2
